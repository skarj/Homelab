apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz-ui
spec:
  parentRefs:
    - name: cilium
      namespace: default
      sectionName: http
  hostnames:
    - signoz.cluster.home
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: signoz
          port: 8080
