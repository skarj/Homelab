apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns-lb
  namespace: pihole
  annotations:
    io.cilium/lb-ipam-ips: "192.168.1.101" # Assigns a specific IP address to the LoadBalancer service
    lbipam.cilium.io/sharing-key: "home-lan-shared" # Allows sharing with other services using the same sharing key
    lbipam.cilium.io/sharing-cross-namespace: "*" # Allows sharing with all namespaces
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
