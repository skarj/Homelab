apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-web-route
  namespace: pihole
spec:
  parentRefs:
    - name: cilium
      namespace: default
      sectionName: http
  hostnames:
    - "pihole.cluster.home"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pihole-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: pihole-dns-udp-route
  namespace: pihole
spec:
  parentRefs:
    - name: cilium
      namespace: default
      sectionName: dns-udp
  rules:
    - backendRefs:
        - name: pihole-dns
          port: 53
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: pihole-dns-tcp-route
  namespace: pihole
spec:
  parentRefs:
    - name: cilium
      namespace: default
      sectionName: dns-tcp
  rules:
    - backendRefs:
        - name: pihole-dns
          port: 53
