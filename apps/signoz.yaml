apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learn-otel-signoz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.141.1
    helm:
      valuesObject:
        clickhouse:
          replicaCount: 1
          zookeeper:
            replicaCount: 1
            resources:
              limits: {}
              requests:
                memory: 256Mi
                cpu: 100m
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 3Gi
          persistence:
            storageClass: nfs-client
            size: 5Gi
        signoz:
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 750m
              memory: 1000Mi
          persistence:
            storageClass: nfs-client
            size: 1Gi
        otelCollector:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: "1"
              memory: 2Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
