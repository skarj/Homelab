apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/rancher/local-path-provisioner.git'
    targetRevision: "v0.0.37"
    path: deploy/chart/local-path-provisioner
    helm:
      values: |
        storageClass:
          name: local-path
          reclaimPolicy: Delete
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths: [] # Disables provisioning on any other node
          - node: cluster # Exact node name from 'kubectl get nodes'
            paths:
              - /srv/local-path-provisioner
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: local-path-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
