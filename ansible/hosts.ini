[master]
master-node ansible_host=cluster.home ansible_user=skaarj ansible_become=yes

[master:vars]
kubernetes_role="control_plane"

[workers]
worker-01 ansible_host=rpi1 ansible_user=pi ansible_become=yes

[workers:vars]
kubernetes_role="node"
ansible_ssh_common_args='-o ProxyJump=skaarj@cluster.home'
ansible_ssh_private_key_file='~/.ssh/id_rsa_rpi'
